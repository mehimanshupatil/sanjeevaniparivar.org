name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json "packageManager"), Node.js,
      # and runs `pnpm install` with the pnpm store cached between runs.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Test
        run: pnpm test

      - name: Type-check (.astro, .ts, .tsx)
        run: pnpm check

      - name: Build site
        run: pnpm run build

      # Chromium for rendering Publicity, cached per Playwright version.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Screenshots the built Publicity pages into dist/publicity/** (PNG + PDF).
      # Fails if any image's text overflows or an image doesn't load.
      - name: Render publicity
        run: pnpm run build:publicity

      # Lets PR reviewers download and check the rendered Publicity.
      - name: Upload publicity for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: publicity
          path: |
            dist/publicity/**/*.png
            dist/publicity/**/*.pdf

      - name: Upload site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # Deploys only from main, never from a pull request.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
