intro: >-
  आपल्या विद्यार्थ्यांच्या सर्वांगीण उन्नतीसाठी, त्यांच्यातील सुप्त कलागुणांना वाव मिळावा याकरिता
  संजीवनी परिवार सातत्याने प्रयत्नशील आहे. त्याचाच एक भाग म्हणून गेली {{ yearsRunning }} वर्षे
  संजीवनी कलादालन अंतर्गत आकाशकंदील व शाडूमाती गणेशमूर्ती बनवण्याच्या कार्यशाळांचे आयोजन करत आहे.

rulesHeading: महत्त्वाची माहिती
rules:
  - कार्यशाळेतील सहभागासाठी ₹१००/- प्रवेश शुल्क आकारले जाईल.
  - आकाशकंदील बनवण्यासाठीचे आवश्यक ते सर्व साहित्य पुरविले जाईल.
  - सहभागी विद्यार्थ्यांना चहा/नाश्ता जागेवर दिला जाईल.
  - आकाशकंदील कार्यशाळेसाठी १० वर्षांवरील विद्यार्थ्यांना सहभाग घेता येईल.

