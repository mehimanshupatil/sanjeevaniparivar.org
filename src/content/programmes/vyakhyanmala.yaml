quote:
  text: "हें सारस्वताचें गोड । तुम्हींचि लाविलें जी झाड ।\nतरी आतां अवधानामृतें वाड । सिंपोनि कीजे ॥"

intro: >-
  ऋतुचक्र वसंत ऋतूचे नावीन्य लेवून येते. सृष्टी अंतर्बाह्य मोहरून निघते. २००३ पासून विविध
  क्षेत्रांतील नामांकित वक्ते नानाविध विषयांद्वारे जगाचा अंतर्बाह्य वेध घेणारे व्यासपीठ म्हणजे
  संजीवनी व्याख्यानमाला. आधुनिक जगातील आव्हानांना सामोरे जाताना अंतर्मुख होऊन स्वतःमध्ये
  बदलाची जाणीव करून देण्यासाठी यावर्षी संजीवनी व्याख्यानमालेत येत आहेत.

closing:
  - text: आपणा सर्वांना मनःपूर्वक आमंत्रण!
    emphasis: true
  - text: अवश्य या! विचाराचे नाते, नावीन्याची ओढ जपू या, जोपासू या, थोडेसे अंतर्मुख होऊ या!

