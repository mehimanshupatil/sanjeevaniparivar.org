# संजीवनी कलादालन — श्री गणेशमूर्ती (शाडूमाती) कार्यशाळा. दरवर्षी हेच राहते.
# दरवर्षीचे तपशील (तारीख, स्थळ) src/content/editions/<वर्ष>/ganeshmurti-karyashala.yaml मध्ये लिहा.

title:
  top: संजीवनी परिवार आयोजित
  main: श्री गणेशमूर्ती कार्यशाळा
type: workshop
kshetra: shikshan
theme: ganeshotsav
formats: [whatsapp, instagram]

logos:
  left: sanjeevani

invite: ॥ संजीवनी कलादालन ॥

intro: >-
  विद्यार्थ्यांच्या सुप्त कलागुणांना प्रोत्साहन देण्यासाठी संजीवनी परिवार वेगवेगळे उपक्रम आयोजित
  करीत असते. सालाबादप्रमाणे यंदाही गणेशोत्सवाच्या पार्श्वभूमीवर शाडूमातीच्या साहाय्याने
  श्रीगणेशमूर्ती बनवणे या उपक्रमाचे आयोजन करण्यात आले आहे.

rulesHeading: महत्त्वाची माहिती
rules:
  - कार्यशाळेतील सहभागासाठी ₹१००/- प्रवेश शुल्क आकारले जाईल.
  - कार्यशाळेत इयत्ता ५ वी ते १० वी पर्यंतच्या विद्यार्थ्यांना सहभागी होता येईल.
  - त्या क्षेत्रातील तज्ज्ञ मंडळी कार्यशाळेत मार्गदर्शन करणार आहेत.
  - मूर्ती बनवण्यासाठी लागणारे साहित्य संजीवनी परिवाराकडून पुरविण्यात येईल.

note:
