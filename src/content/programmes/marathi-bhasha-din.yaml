# संजीवनी परिवार — मराठी भाषा गौरव दिन (कुसुमाग्रज जयंती, २७ फेब्रुवारी). दरवर्षी हेच राहते.
# दरवर्षीचे तपशील (तारीख, वेळ, स्थळ) src/content/editions/<वर्ष>/marathi-bhasha-din.yaml मध्ये लिहा.

title:
  main: मराठी भाषा गौरव दिन
  sub: (कुसुमाग्रज जयंती)
type: celebration
kshetra: shikshan
theme: sahitya
formats: [whatsapp, instagram]

logos:
  left: sanjeevani

invite: ॥ संजीवनी परिवार ॥

intro: >-
  मराठी भाषेच्या समृद्ध परंपरेचा गौरव करण्यासाठी तसेच ज्ञानपीठ पुरस्कार विजेते महाकवी कुसुमाग्रज
  यांच्या स्मृतीस अभिवादन करण्यासाठी संजीवनी परिवाराच्या वाचन अभियानांतर्गत “मराठी भाषा गौरव दिन”
  साजरा करण्यात येणार आहे.

note:
  label: कार्यक्रम
  text: >-
    कार्यक्रमात परिवार संचालित वाचन अभियान केंद्रातील विद्यार्थी कुसुमाग्रजांच्या साहित्यावर आधारित
    काव्यवाचन व निवडक उतारे सादर करणार आहेत.

closing:
  - text: आपली उपस्थिती विद्यार्थ्यांचा उत्साह वाढवणारी ठरेल.
    emphasis: true

# दोन ओळी: "आपला" आणि खाली "संजीवनी परिवार"
footer: "आपला\nसंजीवनी परिवार"
