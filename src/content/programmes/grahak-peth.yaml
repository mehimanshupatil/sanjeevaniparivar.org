# सामवेदी ब्राह्मण ग्राहक पेठ — दरवर्षी हेच राहते.
# दरवर्षीचे तपशील (तारखा, स्थळ) src/content/editions/<वर्ष>/grahak-peth.yaml मध्ये लिहा.

title:
  top: सामवेदी ब्राह्मण
  main: ग्राहक पेठ
type: fair
kshetra: general
theme: diwali
formats: [whatsapp, instagram]

logos:
  left: sanjeevani
  right: jaimuni

# वरच्या मध्यभागी देवतेचे चित्र (public/publicity/assets/deity/)
deity:
  src: /publicity/assets/deity/samaveda.jpg
  name: सामवेद

invite: ॥ सस्नेह निमंत्रण ॥
tagline: दिवाळीच्या खरेदीचा आनंद, आपल्या माणसांसोबत!

organisers:
  - सामवेद जागरण मंच
  - संजीवनी परिवार
  - जैमुनी सहकारी पतपेढी मर्यादित
organisersSuffix: यांच्या संयुक्त विद्यमाने आयोजित

intro: >-
  आपल्या समाजातील उद्योजकांना प्रोत्साहन देण्यासाठी, स्थानिक व्यवसायाला बळ देण्यासाठी
  आणि दिवाळीचा आनंद द्विगुणित करण्यासाठी आपण सर्वांनी एकत्र येऊया!

itemsHeading: पेठेतील आकर्षणे
items:
  - आकर्षक आकाशकंदील, दिवे आणि पणत्या
  - विविध प्रकारचे कपडे
  - चविष्ट दिवाळी फराळ
  - भेटवस्तू आणि सजावटीच्या वस्तू
  - रुचकर खाद्यपदार्थ
  - लहान मुलांसाठी विशेष आकर्षण
itemsMore: आणि बरेच काही…

# {{ fullTitle }} = शीर्षक + मराठी वर्ष, पुढच्या वर्षी आपोआप बदलते.
closing:
  - text: >-
      चला, या दिवाळीत आपल्या समाजातील व्यावसायिकांच्या पाठीशी उभे राहूया, त्यांच्या
      व्यवसायाला प्रोत्साहन देऊया आणि आनंद, आपुलकी व एकतेचा सण एकत्र साजरा करूया!
  - text: सर्व समाज बंधू-भगिनींना व कुटुंबीयांना आग्रहाचे निमंत्रण!
    emphasis: true
  - text: >-
      आपण सहकुटुंब, सहपरिवार उपस्थित राहून {{ fullTitle }}ची शोभा वाढवावी, ही नम्र विनंती!

footer: नक्की या… आपल्या माणसांसाठी, आपल्या समाजासाठी!

