sessions:
  - speaker:
      name: प्रा. डॉ. मृदुला दाढे
      role: प्रथितयश गायिका, संगीत संशोधक
      photo: /publicity/assets/people/mrudula-dadhe.jpg
    topic: तरी असेल गीत हे
    topicNote: (गाणी, संगीतकार, गायक यांचे योगदान — मराठी, हिंदी गाण्यांसह विश्लेषण, विवेचन)
    bio: >-
      प्रा. डॉ. मृदुला दाढे या प्रथितयश गायिका, संगीत संशोधक व प्राध्यापिका आहेत. त्यांनी संगीत
      विषयात एम.ए., पीएच.डी. पदवी मिळवली असून मुंबई विद्यापीठाच्या विभागात अध्यापन करतात.
      लोकसत्ता आणि महाराष्ट्र टाइम्स या दैनिकांमध्ये तसेच अनेक दिवाळी अंकांसाठी सातत्याने संगीत
      विषयक लिखाण. शास्त्रीय, सुगम व चित्रपटसंगीत क्षेत्रात चार दशकांहून अधिक काळ यशस्वी कारकीर्द
      त्यांनी घडवली आहे. संशोधन, लेखन व संगीत क्षेत्रातील भरीव कामगिरीसाठी त्यांना चतुरंग
      प्रतिष्ठानचा ‘कला गौरव’ पुरस्कार, गायनासाठी भारतरत्न स्वरसम्राज्ञी लता मंगेशकर पुरस्कारासह
      अनेक राष्ट्रीय व आंतरराष्ट्रीय सन्मान प्राप्त झाले आहेत.
    closing: संगीत, विचार आणि सुरांची ही सुंदर मैफिल प्रत्यक्ष अनुभवण्यासाठी आपण सर्वांनी अवश्य उपस्थित राहावे, ही नम्र विनंती.
  - speaker:
      name: श्री. आनंद वासुदेव हर्डीकर
      role: ज्येष्ठ संपादक व लेखक
      photo: /publicity/assets/people/anand-hardikar.jpg
    topic: नेताजी, तुमि कोथाय?
    bio: >-
      श्री. आनंद वासुदेव हर्डीकर १९६९ पासून पत्रकारितेच्या क्षेत्रात कार्यरत असून विविध
      वृत्तपत्रांतून व नियतकालिकांमधून त्यांचे २३०० हून अधिक लेख प्रकाशित झाले आहेत. त्याचबरोबर
      १०० स्मरणिकांचे संपादन व ७ स्वतंत्र पुस्तके तसेच ४ अनुवादित पुस्तके प्रकाशित केली आहेत.
      २००३ पासून ‘राजहंस प्रकाशन’चे संपादक म्हणून कार्यरत राहून १७५ हून अधिक पुस्तकांचे संपादन
      केले आहे. साहित्य व संस्कृती क्षेत्रातील त्यांच्या योगदानामुळे ते महाराष्ट्रातील महत्त्वाच्या
      संस्थांशी संलग्न राहिले आहेत.
  - speaker:
      name: श्री. यजुर्वेंद्र अनिल महाजन
      role: संस्थापक, दीपस्तंभ फाउंडेशन – मनोबल
      photo: /publicity/assets/people/yajurvendra-mahajan.jpg
    topic: चांगला माणूस घडण्यासाठी!
    bio: >-
      श्री. यजुर्वेंद्र अनिल महाजन गुरुजी हे दीपस्तंभ फाउंडेशनचे संस्थापक असून शिक्षणक्षेत्रातील
      अभ्यासक व सामाजिक कार्यकर्ते आहेत. त्यांनी दिव्यांग, अनाथ, ट्रान्सजेंडर व आर्थिकदृष्ट्या
      दुर्बल घटकांना स्पर्धा परीक्षा प्रशिक्षण, उच्च शिक्षण व तांत्रिक मार्गदर्शन उपलब्ध करून दिले
      आहे. पुणे, शिरोली व जळगाव येथे निवासी सुविधा व सर्वसमावेशक मार्गदर्शनाद्वारे हजारो
      विद्यार्थ्यांना स्वावलंबनाचा मार्ग दाखवला आहे. ते भारत सरकारच्या GAIL (India) Limited चे
      स्वतंत्र संचालक असून विविध राष्ट्रीय संस्थांमध्येही त्यांचा सहभाग आहे. शिक्षणाद्वारे
      समाजपरिवर्तन घडविणाऱ्या त्यांच्या कार्याला विविध राष्ट्रीय व राज्यस्तरीय पुरस्कारांनी
      गौरवण्यात आले आहे.

